services:
  php-fpm:
    build:
      context: .
      dockerfile: php-fpm/Dockerfile
    environment:
      PHP_IDE_CONFIG: "serverName=web"
      XDEBUG_IDEKEY: "PHPSTORM"
      XDEBUG_MODE: "debug"
      XDEBUG_SESSION: "xdebug_is_great"
      PHP_XDEBUG: "true"
    volumes:
      - ./../:/var/www/html
    networks:
      - php-network

networks:
  php-network:
    driver: bridge
